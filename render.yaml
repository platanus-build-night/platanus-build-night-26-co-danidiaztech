# Render Blueprint — one click provisions the web service AND its database,
# with DATABASE_URL injected automatically. See DEPLOY.md for the click-path.
services:
  - type: web
    name: watchmecode
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Injected by Render from the database below — never hand-written.
      - key: DATABASE_URL
        fromDatabase:
          name: watchmecode-db
          property: connectionString

      # --- Judge tuning for a 512 MB / ~0.1 vCPU free instance ---
      # Without these the judge would fan out to os.cpu_count() workers (the
      # HOST's core count inside a container) and OOM-kill the whole service.
      - key: JUDGE_MAX_WORKERS
        value: "1"
      # Clamps each problem's 256 MB allowance to something the container can
      # survive alongside uvicorn and a ~190 MB g++ compile.
      - key: JUDGE_MEMORY_CAP_MB
        value: "192"
      # Shared CPU runs honest solutions several times slower than the desktop
      # these limits were calibrated on; without slack, correct code gets TLE.
      - key: JUDGE_TIME_SCALE
        value: "4"
      - key: JUDGE_COMPILE_TIMEOUT_S
        value: "60"

databases:
  - name: watchmecode-db
    plan: free
    databaseName: watchmecode
    user: watchmecode
