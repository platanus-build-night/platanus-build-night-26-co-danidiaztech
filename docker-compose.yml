services:
  db:
    image: postgres:16
    container_name: trainer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trainer
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
    ports:
      - "5433:5432"
    volumes:
      - trainer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trainer-db-data:
