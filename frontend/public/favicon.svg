<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    WatchMeCode mark: a play triangle inside a rounded square — "watch" (replay
    a session) and "run" (execute code) in one shape. Mirrors the in-app <Logo/>
    in src/pages/dashboard/DashboardPage.tsx.

    Deliberately a fixed indigo rather than a theme token: a browser tab has no
    access to the page's light/dark state, so the icon must read on both.
  -->
  <rect width="32" height="32" rx="8" fill="#4f46e5"/>
  <path d="M12.5 9.5v13L23 16 12.5 9.5Z" fill="#ffffff"/>
</svg>
